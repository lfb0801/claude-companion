name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
  overlay:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build the overlay and run its checks
        working-directory: mac
        run: |
          swift build -c release --product Companion
          swift run StageChecks
